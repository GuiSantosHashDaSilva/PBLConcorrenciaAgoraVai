version: '3.8'

services:
  # SERVIDORES
  empresa_a:
    build: .
    container_name: vaijunto_empresa_a
    environment:
      - PORT=8811
      - PEERS=172.16.103.1:8812 # colocar o ip do pc com o server 1 172.16.103.2

    ports:
      - "8811:8811"
      - "9811:9811"
    volumes:
      - ./dados_empresa_a:/data 

  empresa_b:
    build: .
    container_name: vaijunto_empresa_b
    environment:
      - PORT=8812
      - PEERS=172.16.103.2:8811 # colocar o ip do pc com o server 2 172.16.103.1

    ports:
      - "8812:8812"
      - "9812:9812"
    volumes:
      - ./dados_empresa_b:/data

  # CLIENTES
  motorista_1:
    build: .
    container_name: vaijunto_motorista_1
    command: ["motorista"]
    environment:
      - SERVER_ADDR=empresa_a:8811
    stdin_open: true         
    tty: true                

  motorista_2:
    build: .
    container_name: vaijunto_motorista_2
    command: ["motorista"]
    environment:
      - SERVER_ADDR=empresa_a:8812
    stdin_open: true         
    tty: true                

  passageiro_1:
    build: .
    container_name: vaijunto_passageiro_1
    command: ["passageiro"]
    environment:
      - SERVER_ADDR=empresa_a:8811
    stdin_open: true         
    tty: true                

  passageiro_2:
    build: .
    container_name: vaijunto_passageiro_2
    environment:
      - SERVER_ADDR=empresa_a:8812
    command: ["passageiro"]
    stdin_open: true         
    tty: true